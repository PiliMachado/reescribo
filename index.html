<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>reescribo · beta</title>
<meta name="description" content="Transformá tus materiales de estudio en resúmenes, audios, cuestionarios, juegos y mapas conceptuales.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: amable, estudiantil, claro — una herramienta de estudio, no un folleto
   IDEA: un cuaderno lavanda donde tu material se transforma en otras formas de aprender
   PICTURE: la zona "Subí tu material" + la grilla de acciones, como en la referencia
   COLOUR and TYPE: lavanda suave, violeta profundo para títulos, blanco en tarjetas; Inter
   LAYOUT: logo arriba, menú lateral, tarjeta blanca de trabajo; en celular el menú pasa arriba */
:root{color-scheme:light dark;
--bg:light-dark(#fbfaff,#110f17);--shell:light-dark(#f4f0fc,#191523);--card:light-dark(#fff,#211c2f);
--ink:light-dark(#2b2140,#eee9fa);--head:light-dark(#4a2f7d,#e2d6ff);--mut:light-dark(#6f6585,#a9a1bf);
--acc:light-dark(#8a63c9,#b89af0);--line:light-dark(#e0d6f3,#352d4a);--soft:light-dark(#f8f5fe,#2a2340);
--ok:light-dark(#23875c,#5fd39d);--bad:light-dark(#c4405c,#f08aa0);--stage:#2c1f52}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
.shell{max-width:1280px;margin:clamp(8px,2vw,24px) auto;background:var(--shell);border:1px solid var(--line);border-radius:28px;padding:clamp(16px,2.4vw,28px)}
header{display:flex;justify-content:space-between;align-items:center;padding-bottom:20px;border-bottom:1px solid var(--line);margin-bottom:24px}
.logo{font-size:34px;font-weight:700;color:var(--head);letter-spacing:-.02em;text-decoration:none}
.me{display:flex;gap:8px;align-items:center;color:var(--acc);text-decoration:none;font-size:18px;min-height:44px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{display:grid;grid-template-columns:250px minmax(0,1fr);gap:24px}
nav h2{font-size:17px;letter-spacing:.02em;color:var(--mut);margin:12px 0 18px;font-weight:600}
nav a{display:flex;gap:10px;align-items:center;padding:10px 12px;margin:0 -12px 8px;border-radius:12px;color:var(--ink);text-decoration:none;font-weight:500}
nav a .ic{color:var(--acc)}
nav a:hover{background:var(--soft)}nav a.on{background:var(--card);color:var(--head);box-shadow:0 1px 0 var(--line)}
main{background:var(--card);border-radius:20px;padding:clamp(18px,2.6vw,30px);min-height:560px}
h1{font-size:clamp(26px,3vw,34px);line-height:1.1;color:var(--head);margin:0 0 8px;text-wrap:balance}
.sub{color:var(--mut);margin:0 0 20px}
h2.q{font-size:20px;color:var(--head);margin:26px 0 14px}
.drop{display:flex;flex-direction:column;align-items:center;gap:6px;padding:26px 16px;border:1.5px solid var(--line);border-radius:16px;background:var(--soft);cursor:pointer;text-align:center;transition:border-color .2s}
.drop:hover,.drop.over{border-color:var(--acc)}
.drop .ic{width:40px;height:40px;color:var(--acc)}
.drop b{font-size:24px;font-weight:600}.drop small{color:var(--mut);font-size:15px}
.alt{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.act{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 10px;border:1.5px solid var(--line);border-radius:14px;color:var(--ink);text-decoration:none;font-weight:500;background:var(--card)}
.act .ic{width:24px;height:24px;color:var(--acc)}.act:hover{border-color:var(--acc);background:var(--soft)}
button,.btn{min-height:44px;padding:0 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
button:hover{border-color:var(--acc)}button:disabled{opacity:.5;cursor:default}
.pri{background:var(--acc);border-color:var(--acc);color:#fff}
:root:not([data-theme=light]) .pri{color:light-dark(#fff,#1b1426)}
.ghost{border-color:transparent;background:none;color:var(--mut)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
input[type=text],select,textarea{border:1.5px solid var(--line);border-radius:12px;background:var(--card);padding:10px 12px;font-size:16px;min-height:44px}
textarea{width:100%;min-height:150px;resize:vertical;line-height:1.5}
.chip{display:inline-flex;gap:6px;align-items:center;padding:6px 12px;border-radius:999px;background:var(--soft);border:1px solid var(--line);font-size:14px;margin-top:14px;color:var(--mut)}
.chip strong{color:var(--head)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:end;padding:14px;background:var(--soft);border-radius:14px;margin-bottom:20px}
.bar label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut);flex:1 1 220px}
.bar label.sm{flex:0 1 160px}
.empty{padding:34px 20px;text-align:center;border:1.5px dashed var(--line);border-radius:16px;color:var(--mut)}
.empty .ic{width:36px;height:36px;color:var(--acc)}
.load{display:flex;gap:12px;align-items:center;padding:22px;color:var(--mut)}
.dots{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--acc);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.err{padding:14px 16px;border-radius:12px;background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad)}
.note{font-size:14px;color:var(--mut);margin:8px 0}
.md{max-width:70ch}.md h3{color:var(--head);font-size:19px;margin:22px 0 8px}.md h3:first-child{margin-top:0}
.md ul{padding-left:20px}.md li{margin:5px 0}
.row{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0 16px;align-items:center}
.trans,.paste{margin-top:16px;padding:18px;border:1.5px solid var(--line);border-radius:16px;background:var(--soft)}
.trans h2,.paste h2{margin:0 0 6px;font-size:19px;color:var(--head)}
audio{width:100%;margin:8px 0}
.live{min-height:22px;color:var(--acc);font-style:italic;margin-bottom:8px}
.rec{color:var(--bad)!important;border-color:var(--bad)!important;background:var(--card)!important}
/* podcast */
.pod{border:1.5px solid var(--line);border-radius:16px;overflow:hidden}
.podh{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:16px;background:var(--soft)}
.podh b{font-size:18px;color:var(--head)}
.lines{max-height:440px;overflow:auto;padding:8px 16px 16px}
.ln{display:grid;grid-template-columns:72px minmax(0,1fr);gap:10px;padding:10px;border-radius:10px;transition:background .2s}
.ln span{font-weight:600;font-size:14px;color:var(--acc)}.ln.b span{color:light-dark(#c25a86,#f29ac0)}
.ln.on{background:var(--soft)}
/* quiz */
.qcard{max-width:720px}.qn{color:var(--mut);font-size:14px}
.prog{height:6px;border-radius:9px;background:var(--line);margin:8px 0 18px}.prog i{display:block;height:100%;border-radius:9px;background:var(--acc)}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px;height:auto;line-height:1.4}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--card))}
.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--card))}
.exp{padding:12px 14px;border-radius:12px;background:var(--soft);margin:12px 0}
.big{font-size:clamp(40px,7vw,64px);font-weight:700;color:var(--head);line-height:1}
/* juego */
.game{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:12px}
.game button{display:block;width:100%;height:auto;text-align:left;margin-bottom:8px;padding:12px 14px;line-height:1.35}
.game .sel{border-color:var(--acc);background:var(--soft)}
.game .done{border-color:var(--ok);color:var(--ok);opacity:.7;cursor:default}
.game .shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.stats{display:flex;gap:18px;color:var(--mut);font-size:14px;margin-bottom:12px}
/* explicación */
.stage{position:relative;aspect-ratio:16/9;background:var(--stage);color:#fff;border-radius:18px;padding:clamp(18px,4vw,48px);display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.stage::after{content:"";position:absolute;right:-60px;bottom:-60px;width:240px;height:240px;border-radius:50%;background:#8a63c9;opacity:.35}
.stage small{opacity:.75;font-size:14px}
.stage h2{font-size:clamp(22px,3.4vw,38px);line-height:1.1;margin:8px 0 16px;position:relative;z-index:1}
.stage ul{margin:0;padding-left:20px;font-size:clamp(15px,1.8vw,19px);position:relative;z-index:1}
.stage li{margin:6px 0;animation:fi .5s both}.stage li:nth-child(2){animation-delay:.25s}.stage li:nth-child(3){animation-delay:.5s}
@keyframes fi{from{opacity:0;transform:translateY(8px)}}
.pdots{display:flex;gap:6px;justify-content:center;margin:12px 0}.pdots i{width:28px;height:5px;border-radius:9px;background:var(--line)}.pdots i.on{background:var(--acc)}
.cap{max-width:70ch;margin:0 auto;text-align:center;color:var(--mut)}
/* mapa */
.map{position:relative;display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1fr) minmax(0,1.25fr);column-gap:52px;row-gap:16px;align-items:center;padding:8px 0}
.map svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.node{position:relative;z-index:1;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;line-height:1.3}
.mc{grid-column:1;background:var(--acc);color:#fff;border-color:var(--acc);font-weight:600;font-size:18px;padding:14px}
.mb{grid-column:2;font-weight:600;border-left-width:5px}
.mk{grid-column:3;display:flex;flex-direction:column;gap:6px}.mk .node{font-size:14px}
/* textos */
.list{display:grid;gap:10px}
.item{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:14px 16px;border:1.5px solid var(--line);border-radius:14px}
.item.on{border-color:var(--acc);background:var(--soft)}
.item b{display:block;color:var(--head)}.item small{color:var(--mut)}
.chat{margin-top:22px;border-top:1px solid var(--line);padding-top:16px}
.msg{padding:10px 14px;border-radius:14px;margin:8px 0;max-width:85%}
.msg.u{margin-left:auto;background:var(--acc);color:#fff}.msg.a{background:var(--soft)}
.ask{display:flex;gap:8px}.ask input{flex:1}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--head);color:var(--card);padding:12px 18px;border-radius:12px;font-size:15px;z-index:9;max-width:90vw}
footer{text-align:center;color:var(--mut);font-size:13px;margin:10px 0 24px;padding:0 16px}
@media(max-width:820px){.wrap{grid-template-columns:minmax(0,1fr)}
 nav h2{display:none}nav .nl{display:flex;overflow-x:auto;gap:4px;padding-bottom:4px}nav a{flex:none;margin:0;white-space:nowrap}}
@media(max-width:640px){.map{display:block}.map svg{display:none}.mc{margin-bottom:10px}.mb{margin:16px 0 6px}.mk{padding-left:16px;border-left:2px solid var(--line)}
 .game{grid-template-columns:minmax(0,1fr)}.stage{aspect-ratio:auto;min-height:260px}.logo{font-size:28px}.me span{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="shell">
<header><a class="logo" href="#inicio">reescribo.</a><a class="me" href="#textos"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="10" r="3"/><path d="M6.5 18.5a6 6 0 0 1 11 0"/></svg><span>Mi espacio</span></a></header>
<div class="wrap">
<nav><h2>MENÚ PRINCIPAL</h2><div class="nl" id="nav"></div></nav>
<main id="main"></main>
</div>
</div>
<footer>reescribo · beta. Todo lo generado sale de tu material con IA (Gemini): revisalo antes de estudiar.</footer>
<input type="file" id="file" hidden accept=".pdf,.docx,.txt,.md,audio/*,.mp3,.m4a,.wav,.ogg,.webm,.aac">
<script src="app.js"></script>
</body>
</html>
